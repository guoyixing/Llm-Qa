# 仅登记项目数据和受保护仓库 URL 的配置键名。
# 不得在本文件中填写仓库 URL、Token 或其他凭据。
version: 1
projects:
  - project_id: hisense-ids-app
    name: "海信 IDS 应用"
    code_dir: data/code/hisense-ids-app
    standards_dir: standards/projects/hisense-ids-app
    default_branch: projectDevGroup
    repository_url_config_key: PROJECT_HISENSE_IDS_APP_REPO_URL
    enabled: true
  - project_id: hisense-ids-app-spec
    name: "海信 IDS 应用-结构化分支"
    code_dir: data/code/hisense-ids-app-spec
    standards_dir: standards/projects/hisense-ids-app-spec
    default_branch: projectDevGroup-specTemplate
    repository_url_config_key: PROJECT_HISENSE_IDS_APP_SPEC_REPO_URL
    enabled: true
  - project_id: hisense-ids-app-need
    name: "海信 IDS 应用-需求全链路分支"
    code_dir: data/code/hisense-ids-app-need
    standards_dir: standards/projects/hisense-ids-app-need
    default_branch: projectDevGroup-specTemplate
    repository_url_config_key: PROJECT_HISENSE_IDS_APP_NEED_REPO_URL
    enabled: true
